name: Release

# Builds Native AOT binaries for Windows, Linux and macOS and publishes them as a GitHub release
# when a version tag (v1.2.3) is pushed.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  publish:
    name: Publish (${{ matrix.rid }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, rid: win-x64 }
          - { os: ubuntu-latest, rid: linux-x64 }
          - { os: macos-latest, rid: osx-arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Install Native AOT prerequisites (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev
      - name: Version from tag
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF_NAME#v}"; else v="0.0.0-dev"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: Publish (Native AOT)
        run: >
          dotnet publish src/Mod2Xgm.csproj -c Release -r ${{ matrix.rid }}
          -p:Version=${{ steps.version.outputs.version }}
          -o artifacts/publish/${{ matrix.rid }}
      - name: Smoke test
        shell: bash
        run: |
          bin="artifacts/publish/${{ matrix.rid }}/Mod2Xgm"
          [ -f "$bin.exe" ] && bin="$bin.exe"
          "$bin"
      - name: Package
        shell: bash
        run: |
          name="mod2xgm-${{ steps.version.outputs.version }}-${{ matrix.rid }}"
          dir="artifacts/publish/${{ matrix.rid }}"
          cp LICENSE THIRD-PARTY-NOTICES.md README.md "$dir/"
          find "$dir" -name '*.pdb' -o -name '*.dbg' -o -name '*.dSYM' | xargs -r rm -rf
          mkdir -p artifacts/dist
          if [ "$RUNNER_OS" = "Windows" ]; then
            (cd "$dir" && 7z a -tzip "../../dist/$name.zip" . > /dev/null)
          else
            tar -czf "artifacts/dist/$name.tar.gz" -C "$dir" .
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.rid }}
          path: artifacts/dist/*

  release:
    name: Create GitHub release
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          [[ "$GITHUB_REF_NAME" == *-* ]] && prerelease="--prerelease"
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" \
            --title "Mod2Xgm $GITHUB_REF_NAME" --generate-notes $prerelease
