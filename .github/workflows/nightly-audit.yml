name: Nightly audit

# Ported from TotallyHot-ArcRouter's nightly-audit.yml. Files GitHub issues so the findings
# can be read through the ordinary Issues API (code-scanning alerts are not readable by
# agents). Does not open pull requests, push commits, apply fixes, or request reviews.
#
# Schedule: 10:00 UTC every day. GitHub cron is UTC and does not follow daylight saving, so
# this is 3:00 AM Pacific Daylight Time and 2:00 AM Pacific Standard Time.
# workflow_dispatch can plan without writing issues when dry_run is true.
#
# Dependency findings come from `dotnet list package --vulnerable`, which uses the NuGet
# advisory database and needs no extra token. Code findings come from the same Qodana
# Community .NET linter and qodana.yaml as .github/workflows/code_quality.yml. While there is
# no committed baseline (.qodana/qodana.sarif.json), every Qodana result is filed; once one
# is committed, only results that are not in it (plus every Security-category result) are.
# QODANA_TOKEN is optional and only passed through for Qodana Cloud. This workflow does not
# upload SARIF, so it does not take security-events permission.
#
# Issues are labelled audit:smell or audit:vulnerability plus severity:<level>, and carry a
# fingerprint comment, so a finding never gets a second issue. When a finding disappears or
# comes back, the issue gets one comment; it is never closed or reopened automatically.

on:
  schedule:
    - cron: "0 10 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Plan issue changes and do not create, update, or comment"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: nightly-audit
  cancel-in-progress: false

jobs:
  dependencies:
    name: Dependency vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Check the audit script
        run: python3 .github/scripts/nightly_audit.py --self-test

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: List vulnerable NuGet packages
        run: bash .github/scripts/collect-vulnerable-packages.sh "${RUNNER_TEMP}/nuget-audit"

      - name: File dependency vulnerability issues
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AUDIT_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          DRY_RUN: ${{ inputs.dry_run == true && 'true' || 'false' }}
        run: |
          set -euo pipefail
          args=(
            sync-nuget
            --input-dir "${RUNNER_TEMP}/nuget-audit"
            --repo "${GITHUB_REPOSITORY}"
            --run-url "${AUDIT_RUN_URL}"
          )
          if [ "${DRY_RUN}" = "true" ]; then
            args+=(--dry-run)
          fi
          python3 .github/scripts/nightly_audit.py "${args[@]}"

  qodana:
    name: Qodana smells and security inspections
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 1

      # Pass the committed baseline to Qodana when there is one, so its results carry a
      # baselineState and match the fingerprints code_quality.yml uses.
      - name: Choose Qodana arguments
        id: options
        run: |
          set -euo pipefail
          if [ -f .qodana/qodana.sarif.json ]; then
            echo "args=--within-docker true --baseline .qodana/qodana.sarif.json" >> "$GITHUB_OUTPUT"
            echo "baseline=.qodana/qodana.sarif.json" >> "$GITHUB_OUTPUT"
          else
            echo "args=--within-docker true" >> "$GITHUB_OUTPUT"
            echo "baseline=" >> "$GITHUB_OUTPUT"
            echo "No baseline committed: every Qodana result will be filed."
          fi

      # Same linter as code_quality.yml. push-fixes stays none, pull-request comments and check
      # annotations stay off, and the checkout has no credentials, so this step cannot push or
      # open a pull request. Caches and artifact upload stay off.
      - name: Qodana scan
        id: qodana
        continue-on-error: true
        uses: JetBrains/qodana-action@v2026.2.2
        with:
          args: ${{ steps.options.outputs.args }}
          pr-mode: false
          post-pr-comment: false
          use-annotations: false
          push-fixes: none
          upload-result: false
          use-caches: false
          results-dir: ${{ runner.temp }}/qodana/results
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN }}

      - name: File smell and code vulnerability issues
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AUDIT_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          DRY_RUN: ${{ inputs.dry_run == true && 'true' || 'false' }}
          BASELINE: ${{ steps.options.outputs.baseline }}
        run: |
          set -euo pipefail
          sarif="${RUNNER_TEMP}/qodana/results/qodana.sarif.json"
          if [ ! -f "$sarif" ]; then
            echo "::error::Qodana did not produce a SARIF report"
            exit 1
          fi
          args=(
            sync-sarif
            --sarif "$sarif"
            --repo "${GITHUB_REPOSITORY}"
            --run-url "${AUDIT_RUN_URL}"
          )
          if [ -n "${BASELINE}" ]; then
            args+=(--baseline "${BASELINE}")
          fi
          if [ "${DRY_RUN}" = "true" ]; then
            args+=(--dry-run)
          fi
          python3 .github/scripts/nightly_audit.py "${args[@]}"
