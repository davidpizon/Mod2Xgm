# Qodana configuration for .github/workflows/code_quality.yml (https://www.jetbrains.com/help/qodana/qodana-yaml.html)
version: "1.0"

# Qodana Community for .NET (free; QODANA_TOKEN optional, used for Qodana Cloud when the secret exists).
linter: jetbrains/qodana-cdnet:2026.2

profile:
  name: qodana.recommended

dotnet:
  solution: Mod2Xgm.slnx

# The linter image ships the .NET 10 SDK only, which can't build net11.0 projects (NETSDK1045; ADR 0103). Install the
# .NET 11 SDK next to it before the scan; with no SDK pinned in global.json, the newest is used.
bootstrap: >-
  (curl -fsSL https://dot.net/v1/dotnet-install.sh || wget -qO- https://dot.net/v1/dotnet-install.sh)
  | bash -s -- --channel 11.0 --install-dir "$(dirname "$(readlink -f "$(command -v dotnet)")")"

# Documentation and reference specs aren't code.
exclude:
  - name: All
    paths:
      - docs
